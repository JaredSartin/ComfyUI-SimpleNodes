name: Publish to ComfyUI Registry

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      - name: Build distributions
        run: |
          python -m build --sdist --wheel --outdir dist

      - name: Create package archive
        run: |
          # Create a zip of the repository contents excluding Git internals and CI artifacts
          zip -r comfy_package.zip . -x "\.git/*" "dist/*" "comfy_package.zip" "\.github/*"

      - name: Publish to ComfyUI Registry
        env:
          COMFY_REGISTRY_TOKEN: ${{ secrets.COMFY_REGISTRY_TOKEN }}
          COMFY_REGISTRY_URL: ${{ secrets.COMFY_REGISTRY_URL }}
        run: |
          chmod +x scripts/publish.sh
          ./scripts/publish.sh comfy_package.zip
